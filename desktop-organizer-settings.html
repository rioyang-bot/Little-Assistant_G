<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>整理視窗設定</title>
</head>
<body class="settings-window">
  <h1 id="settings-title">整理視窗設定</h1>
  <section id="settings" inert>
    <label>名稱 <input id="name" maxlength="60" /></label>
    <label>檔案排列 <select id="arrangement" aria-label="檔案排列"><option value="free">自由排列</option><option value="grid">對齊排列</option></select></label>
    <label>背景透明度 <input id="opacity" type="range" min="0" max="100" /><output id="opacity-value"></output></label>
    <div class="color-row">
      <label>底色 <input id="color" type="color" value="#171c2a" /></label>
      <label>檔名文字顏色 <input id="text-color" type="color" value="#f7f7fb" /></label>
    </div>
    <label class="header-color-row">標題列底色
      <select id="header-color-mode" aria-label="標題列底色"><option value="follow">跟隨背景</option><option value="custom">自訂底色</option></select>
      <input id="header-color" type="color" value="#171c2a" aria-label="自訂標題列底色" hidden />
    </label>
    <div class="color-row">
      <label>標題列文字顏色 <input id="header-text-color" type="color" value="#f7f7fb" /></label>
    </div>
    <label>背景圖案 <select id="pattern"><option value="none">純色</option><option value="dots">圓點</option><option value="grid">格線</option><option value="diagonal">斜紋</option></select></label>
    <div><button id="background">選擇背景圖片</button><button id="clear-background">移除背景圖片</button></div>
    <div class="settings-actions"><button id="save">儲存設定</button><button id="cancel">取消</button></div>
    <button id="delete" class="danger">刪除整理視窗</button>
    <p id="status" role="status" hidden></p>
  </section>
  <script type="module" src="/src/desktop-organizer-settings.js"></script>
</body>
</html>
